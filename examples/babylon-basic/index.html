<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3DShaders.js – Babylon.js Basic Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #111; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #gui {
      position: absolute; top: 12px; right: 12px;
      background: rgba(20,20,30,0.85); color: #eee;
      padding: 16px; border-radius: 8px; min-width: 220px;
    }
    #gui h2 { font-size: 14px; margin-bottom: 12px; color: #8af; }
    .ctrl { margin-bottom: 10px; }
    .ctrl label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
    .ctrl input[type=range] { width: 100%; }
    button {
      width: 100%; padding: 8px; margin-top: 8px;
      background: #3a6; border: none; color: #fff; border-radius: 4px; cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="gui">
    <h2>3DShaders.js (Babylon)</h2>
    <div class="ctrl">
      <label>Brightness <span id="v-brightness">0</span></label>
      <input type="range" id="brightness" min="-0.5" max="0.5" step="0.01" value="0" />
    </div>
    <div class="ctrl">
      <label>Contrast <span id="v-contrast">1</span></label>
      <input type="range" id="contrast" min="0.5" max="2" step="0.01" value="1" />
    </div>
    <div class="ctrl">
      <label>Saturation <span id="v-saturation">1</span></label>
      <input type="range" id="saturation" min="0" max="2" step="0.01" value="1" />
    </div>
    <button id="reset">Reset</button>
  </div>

  <script type="module">
    // Babylon CDN + local library
    import { BabylonPostProcess } from '../../src/babylon/index.js';

    // Load Babylon from CDN
    const BABYLON = await import('https://cdn.babylonjs.com/babylon.js').then(m => m.default || window.BABYLON);

    const canvas = document.getElementById('renderCanvas');
    const engine = new BABYLON.Engine(canvas, true);
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.1, 0.1, 0.18, 1);

    const camera = new BABYLON.ArcRotateCamera('cam', Math.PI / 4, Math.PI / 3, 5, BABYLON.Vector3.Zero(), scene);
    camera.attachControl(canvas, true);

    new BABYLON.HemisphericLight('light', new BABYLON.Vector3(0, 1, 0), scene);

    const box = BABYLON.MeshBuilder.CreateBox('box', { size: 1.2 }, scene);
    box.position.x = -1.2;
    const boxMat = new BABYLON.StandardMaterial('boxMat', scene);
    boxMat.diffuseColor = new BABYLON.Color3(0.3, 0.76, 0.97);
    box.material = boxMat;

    const sphere = BABYLON.MeshBuilder.CreateSphere('sphere', { diameter: 1.4 }, scene);
    sphere.position.x = 1.2;
    const sphMat = new BABYLON.StandardMaterial('sphMat', scene);
    sphMat.diffuseColor = new BABYLON.Color3(1, 0.44, 0.26);
    sphere.material = sphMat;

    // Post process
    const post = new BabylonPostProcess(camera, { BABYLON });

    // GUI
    const map = {
      brightness: document.getElementById('brightness'),
      contrast: document.getElementById('contrast'),
      saturation: document.getElementById('saturation')
    };
    Object.entries(map).forEach(([key, el]) => {
      el.addEventListener('input', () => {
        const v = parseFloat(el.value);
        document.getElementById('v-' + key).textContent = v.toFixed(2);
        post.set(key, v);
      });
    });
    document.getElementById('reset').addEventListener('click', () => {
      post.reset();
      map.brightness.value = 0;
      map.contrast.value = 1;
      map.saturation.value = 1;
      document.getElementById('v-brightness').textContent = '0';
      document.getElementById('v-contrast').textContent = '1';
      document.getElementById('v-saturation').textContent = '1';
    });

    engine.runRenderLoop(() => {
      box.rotation.y += 0.01;
      sphere.rotation.y += 0.015;
      scene.render();
    });
    window.addEventListener('resize', () => engine.resize());
  </script>
</body>
</html>
