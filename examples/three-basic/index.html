<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3DShaders.js – Three.js Basic Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #111; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #gui {
      position: absolute; top: 12px; right: 12px;
      background: rgba(20,20,30,0.85); color: #eee;
      padding: 16px; border-radius: 8px; min-width: 220px;
      backdrop-filter: blur(8px);
    }
    #gui h2 { font-size: 14px; margin-bottom: 12px; color: #8af; }
    .ctrl { margin-bottom: 10px; }
    .ctrl label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
    .ctrl input[type=range] { width: 100%; }
    button {
      width: 100%; padding: 8px; margin-top: 8px;
      background: #3a6; border: none; color: #fff; border-radius: 4px; cursor: pointer;
    }
    button:hover { background: #4b7; }
  </style>
</head>
<body>
  <div id="gui">
    <h2>3DShaders.js</h2>
    <div class="ctrl">
      <label>Brightness <span id="v-brightness">0</span></label>
      <input type="range" id="brightness" min="-0.5" max="0.5" step="0.01" value="0" />
    </div>
    <div class="ctrl">
      <label>Contrast <span id="v-contrast">1</span></label>
      <input type="range" id="contrast" min="0.5" max="2" step="0.01" value="1" />
    </div>
    <div class="ctrl">
      <label>Saturation <span id="v-saturation">1</span></label>
      <input type="range" id="saturation" min="0" max="2" step="0.01" value="1" />
    </div>
    <div class="ctrl">
      <label>Blur <span id="v-blur">0</span></label>
      <input type="range" id="blur" min="0" max="8" step="0.1" value="0" />
    </div>
    <div class="ctrl">
      <label>Bloom <span id="v-bloom">0</span></label>
      <input type="range" id="bloom" min="0" max="2" step="0.01" value="0" />
    </div>
    <div class="ctrl">
      <label>Vignette <span id="v-vignette">0</span></label>
      <input type="range" id="vignette" min="0" max="1" step="0.01" value="0" />
    </div>
    <div class="ctrl">
      <label>Grayscale <span id="v-grayscale">0</span></label>
      <input type="range" id="grayscale" min="0" max="1" step="0.01" value="0" />
    </div>
    <div class="ctrl">
      <label>Chromatic <span id="v-chromatic">0</span></label>
      <input type="range" id="chromatic" min="0" max="0.02" step="0.0005" value="0" />
    </div>
    <button id="reset">Reset</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "3dshaders.js": "../../src/index.js",
      "3dshaders.js/three": "../../src/three/index.js"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { ThreeShaderPass } from '3dshaders.js/three';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 1.5, 4);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // Lights
    scene.add(new THREE.AmbientLight(0x404060, 1.5));
    const dir = new THREE.DirectionalLight(0xffffff, 1.2);
    dir.position.set(3, 5, 2);
    scene.add(dir);

    // Objects
    const cube = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({ color: 0x4fc3f7, metalness: 0.3, roughness: 0.4 })
    );
    cube.position.x = -1.2;
    scene.add(cube);

    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(0.7, 32, 32),
      new THREE.MeshStandardMaterial({ color: 0xff7043, metalness: 0.2, roughness: 0.5 })
    );
    sphere.position.x = 1.2;
    scene.add(sphere);

    // Offscreen target + post pass
    const rt = new THREE.WebGLRenderTarget(innerWidth, innerHeight);
    const pass = new ThreeShaderPass(renderer, { THREE });

    // GUI wiring
    const controls = {
      brightness: document.getElementById('brightness'),
      contrast: document.getElementById('contrast'),
      saturation: document.getElementById('saturation'),
      blur: document.getElementById('blur'),
      bloom: document.getElementById('bloom'),
      vignette: document.getElementById('vignette'),
      grayscale: document.getElementById('grayscale'),
      chromatic: document.getElementById('chromatic')
    };

    function updateLabel(id, val) {
      document.getElementById('v-' + id).textContent = Number(val).toFixed(3);
    }

    Object.entries(controls).forEach(([key, el]) => {
      el.addEventListener('input', () => {
        const v = parseFloat(el.value);
        updateLabel(key, v);
        if (key === 'blur') pass.set('blur', { radius: v });
        else if (key === 'bloom') pass.set('bloom', { intensity: v });
        else if (key === 'vignette') pass.set('vignette', { intensity: v });
        else if (key === 'chromatic') pass.set('chromaticAberration', { amount: v });
        else pass.set(key, v);
      });
    });

    document.getElementById('reset').addEventListener('click', () => {
      pass.reset();
      Object.entries(controls).forEach(([key, el]) => {
        el.value = key === 'contrast' || key === 'saturation' ? 1 : 0;
        updateLabel(key, el.value);
      });
    });

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      rt.setSize(innerWidth, innerHeight);
      pass.setSize(innerWidth, innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      cube.rotation.x += 0.01;
      cube.rotation.y += 0.015;
      sphere.rotation.y += 0.012;

      // Render scene to RT then apply post
      renderer.setRenderTarget(rt);
      renderer.render(scene, camera);
      renderer.setRenderTarget(null);
      pass.render(rt.texture);
    }
    animate();
  </script>
</body>
</html>
